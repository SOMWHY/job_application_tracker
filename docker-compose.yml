services:
  db:
    # Docker Hub is unreachable from CN networks; use the DaoCloud mirror.
    # Swap back to `postgres:16-alpine` if you have direct Docker Hub access.
    image: docker.m.daocloud.io/library/postgres:16-alpine
    container_name: jat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: jat
      POSTGRES_PASSWORD: jat_dev_password
      POSTGRES_DB: jat_dev
    ports:
      - "5433:5432"
    volumes:
      - jat_pgdata:/var/lib/postgresql/data
      # Creates jat_test and jat_e2e on first init (idempotent).
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jat -d jat_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jat_pgdata:
